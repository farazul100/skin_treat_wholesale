<head>

  <!-- Open Graph / Facebook / Telegram / WhatsApp -->
  <meta property="og:type" content="website" />

  <meta property="og:title" content="Online Shop" />
  <meta property="og:description" content="সেরা মানের পণ্য ও দ্রুত হোম ডেলিভারি। অর্ডার করতে ভিজিট করুন।" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://sunnahly.com/" />
  <meta name="twitter:title" content="Online Shop" />
  <meta name="twitter:description" content="সেরা মানের পণ্য ও দ্রুত হোম ডেলিভারি।" />
  <meta name="twitter:image" content="/og-image.png" />

  <script>
    (function () {
      try {
        var hex = localStorage.getItem("app_theme_color");
        if (hex) {
          var cleaned = hex.trim().replace(/^#/, "");
          if (cleaned.length === 3) cleaned = cleaned.split("").map(function (c) { return c + c; }).join("");
          if (/^[a-f\d]{6}$/i.test(cleaned)) {
            var int = parseInt(cleaned, 16);
            var r = (int >> 16) & 255, g = (int >> 8) & 255, b = int & 255;
            var max = Math.max(r, g, b), min = Math.min(r, g, b);
            var h = 0, s = 0, l = (max + min) / 2;
            if (max !== min) {
              var d = max - min;
              s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
              if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
              else if (max === g) h = (b - r) / d + 2;
              else h = (r - g) / d + 4;
              h *= 60;
            }
            var hsl = Math.round(h) + " " + Math.round(s * 100) + "% " + Math.round(l * 100) + "%";
            var root = document.documentElement;
            root.style.setProperty("--primary", hsl);
            root.style.setProperty("--ring", hsl);
            root.style.setProperty("--sidebar-primary", hsl);
            root.style.setProperty("--sidebar-ring", hsl);
            if (l > 0.65) {
              root.style.setProperty("--primary-foreground", "140 60% 8%");
            } else {
              root.style.setProperty("--primary-foreground", "0 0% 100%");
            }
          }
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
