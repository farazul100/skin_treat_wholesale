  <meta name="twitter:image" content="/og-image.png" />

  <script>
    (function () {
      try {
        function hexToHslData(hex) {
          var cleaned = hex.trim().replace(/^#/, "");
          if (cleaned.length === 3) cleaned = cleaned.split("").map(function (c) { return c + c; }).join("");
          if (!/^[a-f\d]{6}$/i.test(cleaned)) return null;
          var int = parseInt(cleaned, 16);
          var r = (int >> 16) & 255, g = (int >> 8) & 255, b = int & 255;
          var max = Math.max(r, g, b), min = Math.min(r, g, b);
          var h = 0, s = 0, l = (max + min) / 2;
          if (max !== min) {
            var d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
            else if (max === g) h = (b - r) / d + 2;
            else h = (r - g) / d + 4;
            h *= 60;
          }
          return { hsl: Math.round(h) + " " + Math.round(s * 100) + "% " + Math.round(l * 100) + "%", l: l };
        }

        var root = document.documentElement;
        var themeHex = localStorage.getItem("app_theme_color");
        if (themeHex) {
          var t = hexToHslData(themeHex);
          if (t) {
            root.style.setProperty("--primary", t.hsl);
            root.style.setProperty("--ring", t.hsl);
            root.style.setProperty("--sidebar-primary", t.hsl);
            root.style.setProperty("--sidebar-ring", t.hsl);
            root.style.setProperty("--primary-foreground", t.l > 0.65 ? "140 60% 8%" : "0 0% 100%");
          }
        }
        var footerHex = localStorage.getItem("app_footer_color") || themeHex;
        if (footerHex) {
          var f = hexToHslData(footerHex);
          if (f) {
            root.style.setProperty("--footer-bg", f.hsl);
            root.style.setProperty("--footer-foreground", f.l > 0.65 ? "140 60% 8%" : "0 0% 100%");
            root.style.setProperty("--footer-invert", f.l > 0.65 ? "0" : "1");
          }
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
